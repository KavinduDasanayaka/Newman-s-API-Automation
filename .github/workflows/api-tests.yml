name: API Tests with Newman

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: mern-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mern-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start backend server
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/taskdb
          JWT_SECRET: ci-only-secret
          PORT: 5000
        run: |
          npm start > server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --silent --fail http://127.0.0.1:5000/health > /dev/null; then
            cat server.log
            exit 1
          fi

      - name: Run API tests
        run: npm run test:api

      - name: Upload Newman report
        if: always()   # Even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: mern-backend/newman/report.xml
